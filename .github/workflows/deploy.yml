name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-deploy-main
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull project settings and env
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt output
        run: |
          # Deploy from outside the checkout. The CLI reads HEAD's commit author
          # from the working directory and attaches it to the deployment, and
          # Vercel refuses deployments whose git author lacks project access.
          # A staging dir with no git history has no author to attach.
          staging="$RUNNER_TEMP/deploy"
          mkdir -p "$staging"
          cp -R .vercel "$staging/"
          cd "$staging"
          url=$(vercel deploy --prebuilt --prod --no-wait \
            --token=${{ secrets.VERCEL_TOKEN }} | tail -1)
          echo "url=$url"
          for i in $(seq 1 8); do
            echo "--- poll $i"
            vercel inspect "$url" --token=${{ secrets.VERCEL_TOKEN }} 2>&1 | head -20
            sleep 12
          done
          echo "### $url" >> "$GITHUB_STEP_SUMMARY"
