name: CI

# The same checks as `npm run lint && npm test && npm run build`, on every pull
# request and every push to main. See TESTING.md for what each layer covers.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests (client helpers)
        run: npm run test:unit

      - name: API smoke tests (in-memory store)
        run: npm run test:api

      - name: Translation keys
        run: npm run check:strings

      - name: Build
        run: npm run build
